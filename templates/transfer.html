{% extends "base.html" %}
{% block content %}
<h1><i class="ti ti-arrows-shuffle page-icon"></i>매장 간 재고 이동</h1>
<div class="subtitle">한 매장에서 다른 매장으로 재고를 이동합니다. 제품을 선택하고 수량을 입력하세요.</div>

<div class="card">
  <div class="form-grid">
    <div class="form-field">
      <label>출발 매장 *</label>
      <select id="fromStore" onchange="onFromStoreChange()">
        <option value="">매장 선택</option>
      </select>
    </div>
    <div class="form-field">
      <label>도착 매장 *</label>
      <select id="toStore">
        <option value="">매장 선택</option>
      </select>
    </div>
    <div class="form-field">
      <label>담당자</label>
      <input type="text" id="staff" placeholder="이름">
    </div>
    <div class="form-field">
      <label>메모 (이동처)</label>
      <input type="text" id="memo" placeholder="예: 신사 이동">
    </div>
  </div>
</div>

<div class="card">
  <div class="toolbar" style="margin-bottom:12px;">
    <input type="text" id="searchBox" placeholder="🔍 제품명 검색" autocomplete="off" oninput="onSearchInput()" style="width:220px;">
    <button onclick="loadAllProducts()" class="primary" style="padding:4px 12px; font-size:12px;">📋 전체 보기</button>
    <button onclick="doBatchTransfer()" class="primary" id="batchTransferBtn" disabled>🚚 선택된 제품 이동</button>
    <span style="font-size:12px; color:var(--text-light);" id="selectedCount">0개 선택</span>
  </div>

  <!-- 진행률 표시 -->
  <div id="transferProgressWrap" style="display:none; margin-bottom:12px;">
    <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-light);">
      <span id="transferProgressText">진행 중...</span>
      <span id="transferProgressPercent">0%</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="transferProgressBar" style="width:0%;"></div>
    </div>
  </div>

  <div class="sale-layout">
    <div class="sale-left" style="flex:1; min-width:0;">
      <div class="product-grid" id="transferProductGrid">
        <div class="empty"><span class="empty-icon">🔍</span>제품명을 검색하거나 '전체 보기'를 클릭하세요.</div>
      </div>
    </div>
    <div class="sale-right" style="width:320px; flex-shrink:0;">
      <div class="cart-title">🛒 이동 장바구니</div>
      <div class="cart-items-wrap" id="transferCartWrap" style="max-height:300px; overflow-y:auto;">
        <div id="transferCartList"><div class="cart-empty">선택한 제품이 없습니다</div></div>
      </div>
      <div class="cart-footer" style="border-top:1px solid var(--border); padding-top:12px; margin-top:8px;">
        <div class="cart-total"><span>총 이동 수량</span><span id="transferTotalQty">0개</span></div>
        <div class="cart-total"><span>총 원가</span><span id="transferTotalCost">0원</span></div>
        <button class="primary" style="width:100%;" onclick="doBatchTransfer()">🚚 이동 실행</button>
      </div>
    </div>
  </div>
</div>

<div id="result" style="margin-top:12px;"></div>

<div class="card" style="margin-top:16px;">
  <div class="toolbar" style="margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;">
    <h3 style="margin:0; color:var(--text);">📜 최근 이동 내역</h3>
    <div style="display:flex; gap:8px; align-items:center;">
      <select id="movementFilter" onchange="loadMovements()" style="font-size:12px;">
        <option value="">전체</option>
        <option value="완료">완료만</option>
        <option value="취소">취소만</option>
      </select>
      <button onclick="loadMovements()" style="padding:4px 12px; font-size:12px;">🔄 새로고침</button>
      <button onclick="batchCancelMovements()" id="movementBatchCancelBtn" disabled
              style="padding:4px 12px; font-size:12px; color:var(--danger);">🗑️ 선택 취소 (<span id="movementSelectedCount">0</span>)</button>
    </div>
  </div>
  <div style="overflow-x:auto;">
    <table class="data-table" style="width:100%; font-size:13px;">
      <thead>
        <tr>
          <th style="width:32px; padding:6px 8px;"><input type="checkbox" id="movementSelectAll" onchange="toggleAllMovementCheckboxes()"></th>
          <th style="text-align:left; padding:6px 8px;">일시</th>
          <th style="text-align:left; padding:6px 8px;">제품</th>
          <th style="text-align:left; padding:6px 8px;">출발 → 도착</th>
          <th style="text-align:right; padding:6px 8px;">수량</th>
          <th style="text-align:right; padding:6px 8px;">원가(개당)</th>
          <th style="text-align:right; padding:6px 8px;">원가 합계</th>
          <th style="text-align:left; padding:6px 8px;">담당자</th>
          <th style="text-align:center; padding:6px 8px;">상태</th>
          <th style="text-align:center; padding:6px 8px;">관리</th>
        </tr>
      </thead>
      <tbody id="movementsTbody">
        <tr><td colspan="10" style="text-align:center; padding:20px; color:var(--text-light);">불러오는 중...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
let movementSelectedIds = new Set();

function formatMovementDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function loadMovements() {
  const tbody = document.getElementById('movementsTbody');
  tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:20px; color:var(--text-light);">불러오는 중...</td></tr>';
  movementSelectedIds.clear();
  updateMovementBatchUI();
  try {
    const status = document.getElementById('movementFilter').value;
    const params = new URLSearchParams();
    if (status) params.append('status', status);
    const rows = await api('/api/movements?' + params.toString());
    if (!rows || rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:20px; color:var(--text-light);">이동 내역이 없습니다.</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(m => {
      const isDone = m.status === '완료';
      const statusBadgeClass = isDone ? 'badge-success' : 'badge-neutral';
      return `
        <tr>
          <td style="padding:6px 8px; text-align:center;">
            ${isDone ? `<input type="checkbox" class="movement-checkbox" value="${m.id}" onchange="toggleMovementCheckbox(${m.id})">` : ''}
          </td>
          <td style="padding:6px 8px;">${formatMovementDate(m.created_at)}</td>
          <td style="padding:6px 8px;">${escapeHtml(m.product_name || '')}</td>
          <td style="padding:6px 8px;">${escapeHtml(m.from_store_name || '')} → ${escapeHtml(m.to_store_name || '')}</td>
          <td style="padding:6px 8px; text-align:right;">${fmt(m.quantity)}</td>
          <td style="padding:6px 8px; text-align:right;">${fmt(m.unit_cost || 0)}원</td>
          <td style="padding:6px 8px; text-align:right; font-weight:600;">${fmt(m.total_cost || 0)}원</td>
          <td style="padding:6px 8px;">${escapeHtml(m.staff || '')}</td>
          <td style="padding:6px 8px; text-align:center;"><span class="badge ${statusBadgeClass}">${escapeHtml(m.status)}</span></td>
          <td style="padding:6px 8px; text-align:center;">
            ${isDone ? `<button onclick="cancelMovement(${m.id})" style="color:var(--danger); font-size:12px; padding:2px 10px;">취소</button>` : '-'}
          </td>
        </tr>
      `;
    }).join('');
  } catch (e) {
    console.error('이동 내역 로드 오류:', e);
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:20px; color:var(--danger);">불러오는 중 오류가 발생했습니다.</td></tr>';
  }
}

function toggleMovementCheckbox(id) {
  const cb = document.querySelector(`.movement-checkbox[value="${id}"]`);
  if (cb && cb.checked) movementSelectedIds.add(id);
  else movementSelectedIds.delete(id);
  updateMovementBatchUI();
}

function toggleAllMovementCheckboxes() {
  const checkAll = document.getElementById('movementSelectAll').checked;
  document.querySelectorAll('.movement-checkbox').forEach(cb => {
    cb.checked = checkAll;
    const id = parseInt(cb.value, 10);
    if (checkAll) movementSelectedIds.add(id);
    else movementSelectedIds.delete(id);
  });
  updateMovementBatchUI();
}

function updateMovementBatchUI() {
  document.getElementById('movementSelectedCount').textContent = movementSelectedIds.size;
  document.getElementById('movementBatchCancelBtn').disabled = movementSelectedIds.size === 0;
  const allCbs = document.querySelectorAll('.movement-checkbox');
  const checkedCbs = document.querySelectorAll('.movement-checkbox:checked');
  const selectAll = document.getElementById('movementSelectAll');
  if (selectAll) selectAll.checked = allCbs.length > 0 && allCbs.length === checkedCbs.length;
}

async function cancelMovement(movementId) {
  if (!confirm('이 이동을 취소하시겠습니까? 재고가 이동 전 상태로 복구됩니다.')) return;
  try {
    await api(`/api/transfer/${movementId}/cancel`, { method: 'POST' });
    toast('이동이 취소되었습니다.', false, '✅');
    await loadMovements();
    await loadProducts();
  } catch (e) {
    console.error('이동 취소 오류:', e);
    toast('취소 중 오류가 발생했습니다.', true, '⚠️');
  }
}

async function batchCancelMovements() {
  if (movementSelectedIds.size === 0) return;
  if (!confirm(`선택한 ${movementSelectedIds.size}건의 이동을 일괄 취소하시겠습니까? 재고가 이동 전 상태로 복구됩니다.`)) return;
  try {
    const ids = Array.from(movementSelectedIds);
    const result = await api('/api/movements/cancel_batch', {
      method: 'POST',
      body: JSON.stringify({ ids })
    });
    if (result && result.failed) {
      toast(`${result.cancelled}건 취소 완료, ${result.failed}건 실패`, result.cancelled === 0, '⚠️');
    } else {
      toast(`${result.cancelled}건이 취소되었습니다.`, false, '✅');
    }
    await loadMovements();
    await loadProducts();
  } catch (e) {
    console.error('일괄 취소 오류:', e);
    toast('일괄 취소 중 오류가 발생했습니다.', true, '⚠️');
  }
}
</script>

<script>
let stores = [];
let products = [];
const TRANSFER_CART_KEY = 'transfer_cart';
// 🔥 판매 등록 화면과 동일하게, 다른 페이지로 이동했다가 돌아와도 담아둔
// 이동 목록이 사라지지 않도록 localStorage에 저장/복원한다.
let transferCart = loadCartFromStorage(TRANSFER_CART_KEY);
let searchQuery = '';
let currentFromStore = '';

// ---------- 매장 로드 ----------
async function loadStores() {
  const fromSel = document.getElementById('fromStore');
  const toSel = document.getElementById('toStore');
  fromSel.innerHTML = '<option value="">로딩 중...</option>';
  toSel.innerHTML = '<option value="">로딩 중...</option>';

  try {
    stores = await api('/api/stores');
    if (!stores || stores.length === 0) {
      fromSel.innerHTML = '<option value="">매장 없음</option>';
      toSel.innerHTML = '<option value="">매장 없음</option>';
      toast('등록된 매장이 없습니다.', true, '⚠️');
      return;
    }
    const opts = stores.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
    fromSel.innerHTML = opts;
    toSel.innerHTML = opts;
    
    // 🔥 전역 매장 ID 적용 (출발 매장)
    const globalStoreId = localStorage.getItem('global_store_id');
    if (globalStoreId && stores.some(s => s.id == globalStoreId)) {
      fromSel.value = globalStoreId;
      // 도착 매장은 출발 매장과 다른 매장으로 설정 (첫 번째 다른 매장)
      const otherStore = stores.find(s => s.id != globalStoreId);
      if (otherStore) {
        toSel.value = otherStore.id;
      } else if (stores.length > 1) {
        toSel.value = stores[1].id;
      } else {
        toSel.value = stores[0].id;
      }
    } else if (stores.length > 0) {
      fromSel.value = stores[0].id;
      if (stores.length > 1) {
        toSel.value = stores[1].id;
      } else {
        toSel.value = stores[0].id;
      }
      localStorage.setItem('global_store_id', stores[0].id);
    }
    
    currentFromStore = fromSel.value;
    document.getElementById('transferProductGrid').innerHTML = '<div class="empty"><span class="empty-icon">🔍</span>제품명을 검색하거나 \'전체 보기\'를 클릭하세요.</div>';
  } catch (e) {
    console.error('매장 로드 오류:', e);
    toast('매장 목록을 불러오는 중 오류가 발생했습니다.', true, '⚠️');
    fromSel.innerHTML = '<option value="">매장 오류</option>';
    toSel.innerHTML = '<option value="">매장 오류</option>';
  }
}

function onFromStoreChange() {
  const val = document.getElementById('fromStore').value;
  localStorage.setItem('global_store_id', val);
  currentFromStore = val;
  document.getElementById('searchBox').value = '';
  searchQuery = '';
  transferCart = {};
  saveCartToStorage(TRANSFER_CART_KEY, transferCart);
  renderTransferCart();
  document.getElementById('transferProductGrid').innerHTML = '<div class="empty"><span class="empty-icon">🔍</span>제품명을 검색하거나 \'전체 보기\'를 클릭하세요.</div>';
  document.getElementById('batchTransferBtn').disabled = true;
  document.getElementById('selectedCount').textContent = '0개 선택';
}

function onSearchInput() {
  searchQuery = document.getElementById('searchBox').value.trim();
  if (searchQuery) {
    loadProducts();
  } else {
    document.getElementById('transferProductGrid').innerHTML = '<div class="empty"><span class="empty-icon">🔍</span>제품명을 검색하거나 \'전체 보기\'를 클릭하세요.</div>';
  }
}

function loadAllProducts() {
  document.getElementById('searchBox').value = '';
  searchQuery = '';
  loadProducts();
}

// ---------- 제품 목록 로드 (재고 많은 순 정렬) ----------
const transferSearchGuard = makeSearchGuard();

async function loadProducts() {
  const store_id = document.getElementById('fromStore').value;
  if (!store_id) {
    document.getElementById('transferProductGrid').innerHTML = '<div class="empty">출발 매장을 선택해주세요.</div>';
    return;
  }

  const q = document.getElementById('searchBox').value.trim();
  const params = new URLSearchParams({ 
    store_id, 
    sort: 'qty', 
    order: 'desc',
    hide_zero_stock: '1'   // 재고가 없는 제품은 이동할 수 없으므로 숨긴다
  });
  if (q) params.append('q', q);

  const myToken = transferSearchGuard.next();
  try {
    const result = await apiSearch('/api/products?' + params.toString());
    if (!transferSearchGuard.isCurrent(myToken)) return;
    products = result;
    renderProductGrid();
  } catch (e) {
    if (!transferSearchGuard.isCurrent(myToken)) return;
    console.error('제품 로드 오류:', e);
    toast('제품 목록을 불러오는 중 오류가 발생했습니다.', true, '⚠️');
  }
}

function renderProductGrid() {
  const grid = document.getElementById('transferProductGrid');
  if (!products || products.length === 0) {
    grid.innerHTML = '<div class="empty"><span class="empty-icon">📦</span>표시할 제품이 없습니다.</div>';
    return;
  }

  grid.innerHTML = products.map(p => {
    const inCart = transferCart[p.id] ? transferCart[p.id].qty : 0;
    const disabled = p.qty <= 0 ? 'disabled' : '';
    return `
      <div class="product-card ${disabled}" onclick="${p.qty > 0 ? `addToTransferCart(${p.id})` : ''}">
        <div class="pname">${escapeHtml(p.name)}</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
          <span class="chip" style="background:${p.brand_color || '#8a8f98'}; font-size:10px; padding:2px 8px;">${escapeHtml(p.brand_name || '미분류')}</span>
          <span class="pprice">재고 ${fmt(p.qty)}</span>
        </div>
        <div class="pqty">원가 ${fmt(p.cost_price || 0)}원</div>
        ${inCart > 0 ? `<div style="font-size:12px; color:var(--accent);">📦 ${inCart}개 선택</div>` : ''}
      </div>
    `;
  }).join('');
  updateSelectedUI();
}

// ---------- 장바구니 ----------
function addToTransferCart(pid) {
  const product = products.find(p => p.id === pid);
  if (!product) return;
  if (product.qty <= 0) {
    toast('재고가 없습니다.', true, '⚠️');
    return;
  }

  const currentQty = transferCart[pid] ? transferCart[pid].qty : 0;
  if (currentQty + 1 > product.qty) {
    toast(`재고(${product.qty}개)보다 많이 담을 수 없습니다.`, true, '⚠️');
    return;
  }

  if (transferCart[pid]) {
    transferCart[pid].qty += 1;
  } else {
    transferCart[pid] = { product, qty: 1 };
  }
  saveCartToStorage(TRANSFER_CART_KEY, transferCart);
  renderTransferCart();
  renderProductGrid();
}

function changeTransferQty(pid, delta) {
  const item = transferCart[pid];
  if (!item) return;
  const newQty = item.qty + delta;
  if (newQty <= 0) {
    delete transferCart[pid];
    saveCartToStorage(TRANSFER_CART_KEY, transferCart);
    renderTransferCart();
    renderProductGrid();
    return;
  }
  if (newQty > item.product.qty) {
    toast(`재고(${item.product.qty}개)보다 많이 담을 수 없습니다.`, true, '⚠️');
    renderTransferCart();
    return;
  }
  item.qty = newQty;
  saveCartToStorage(TRANSFER_CART_KEY, transferCart);
  renderTransferCart();
  renderProductGrid();
}

function setTransferQty(pid, value) {
  const qty = parseInt(value);
  if (isNaN(qty) || qty < 1) { renderTransferCart(); return; }
  const item = transferCart[pid];
  if (!item) return;
  if (qty > item.product.qty) {
    toast(`재고(${item.product.qty}개)보다 많이 담을 수 없습니다.`, true, '⚠️');
    renderTransferCart();
    return;
  }
  item.qty = qty;
  saveCartToStorage(TRANSFER_CART_KEY, transferCart);
  renderTransferCart();
  renderProductGrid();
}

function removeFromTransferCart(pid) {
  delete transferCart[pid];
  saveCartToStorage(TRANSFER_CART_KEY, transferCart);
  renderTransferCart();
  renderProductGrid();
}

function renderTransferCart() {
  const list = document.getElementById('transferCartList');
  const items = Object.entries(transferCart);
  if (items.length === 0) {
    list.innerHTML = '<div class="cart-empty">선택한 제품이 없습니다</div>';
    document.getElementById('transferTotalQty').textContent = '0개';
    document.getElementById('batchTransferBtn').disabled = true;
    return;
  }

  let totalQty = 0;
  let totalCost = 0;
  list.innerHTML = items.map(([pid, item]) => {
    totalQty += item.qty;
    const itemCost = (item.product.cost_price || 0) * item.qty;
    totalCost += itemCost;
    return `
      <div class="cart-item">
        <div class="ci-name">
          ${escapeHtml(item.product.name)}
          <div class="ci-sub">원가 ${fmt(item.product.cost_price || 0)}원 × ${item.qty} = ${fmt(itemCost)}원</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:2px; align-items:flex-end;">
          <div class="qty-ctrl">
            <button onclick="changeTransferQty(${pid}, -1)">-</button>
            <input type="number" class="qty-input" value="${item.qty}" min="1" max="${item.product.qty}" 
                   onchange="setTransferQty(${pid}, this.value)" onfocus="this.select()">
            <button onclick="changeTransferQty(${pid}, 1)">+</button>
          </div>
        </div>
        <button onclick="removeFromTransferCart(${pid})" style="color:var(--danger); border:none; background:none; font-size:16px;">✕</button>
      </div>
    `;
  }).join('');

  document.getElementById('transferTotalQty').textContent = fmt(totalQty) + '개';
  const totalCostEl = document.getElementById('transferTotalCost');
  if (totalCostEl) totalCostEl.textContent = fmt(totalCost) + '원';
  document.getElementById('batchTransferBtn').disabled = items.length === 0;
}

function updateSelectedUI() {
  const count = Object.keys(transferCart).length;
  document.getElementById('selectedCount').textContent = count + '개 선택';
}

// ---------- 일괄 이동 실행 ----------
async function doBatchTransfer() {
  const items = Object.entries(transferCart);
  if (items.length === 0) {
    toast('이동할 제품을 선택해주세요.', true, '⚠️');
    return;
  }

  const from_store_id = document.getElementById('fromStore').value;
  const to_store_id = document.getElementById('toStore').value;
  const staff = document.getElementById('staff').value || null;
  const memo = document.getElementById('memo').value || null;

  if (!from_store_id || !to_store_id) {
    toast('출발 매장과 도착 매장을 선택해주세요.', true, '⚠️');
    return;
  }
  if (from_store_id === to_store_id) {
    toast('출발 매장과 도착 매장이 같습니다.', true, '⚠️');
    return;
  }

  const payload = {
    from_store_id: parseInt(from_store_id, 10),
    to_store_id: parseInt(to_store_id, 10),
    staff: staff,
    memo: memo,
    items: items.map(([pid, item]) => ({ product_id: parseInt(pid, 10), quantity: item.qty }))
  };

  // 진행률 표시 시작
  const progressWrap = document.getElementById('transferProgressWrap');
  const progressBar = document.getElementById('transferProgressBar');
  const progressText = document.getElementById('transferProgressText');
  const progressPercent = document.getElementById('transferProgressPercent');
  progressWrap.style.display = 'block';
  progressBar.style.width = '0%';
  progressPercent.textContent = '0%';
  progressText.textContent = '이동 준비 중...';

  try {
    progressText.textContent = '이동 실행 중...';
    const result = await api('/api/transfer', { method: 'POST', body: JSON.stringify(payload) });
    
    // 진행률 100% 표시
    progressBar.style.width = '100%';
    progressPercent.textContent = '100%';
    progressText.textContent = '이동 완료!';
    setTimeout(() => { progressWrap.style.display = 'none'; }, 2000);

    let msg = `✅ ${result.success.length}개 이동 완료`;
    if (result.failed.length > 0) {
      msg += `, ❌ ${result.failed.length}개 실패`;
      console.log('실패 목록:', result.failed);
    }
    toast(msg, result.failed.length > 0, result.failed.length > 0 ? '⚠️' : '✅');

    // 장바구니 초기화
    transferCart = {};
    saveCartToStorage(TRANSFER_CART_KEY, transferCart);
    renderTransferCart();
    await loadProducts();
    await loadMovements();
    
    // 결과 표시
    const resultDiv = document.getElementById('result');
    let html = '';
    if (result.success.length > 0) {
      html += `<div style="color:var(--accent); font-weight:600;">✅ 이동 완료: ${result.success.length}건</div>`;
    }
    if (result.failed.length > 0) {
      html += `<div style="color:var(--danger); font-weight:600;">❌ 실패: ${result.failed.length}건</div>`;
      html += `<div style="font-size:12px; max-height:150px; overflow-y:auto; background:var(--hover-bg); padding:6px 10px; border-radius:var(--radius); margin-top:4px;">`;
      result.failed.forEach(f => {
        const p = products.find(p => p.id === f.product_id);
        html += `<div>${p ? escapeHtml(p.name) : '#'+f.product_id}: ${escapeHtml(f.error)}</div>`;
      });
      html += `</div>`;
    }
    resultDiv.innerHTML = html ? `<div class="card">${html}</div>` : '';
    resultDiv.scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    console.error('이동 오류:', e);
    progressWrap.style.display = 'none';
    toast('이동 중 오류가 발생했습니다.', true, '⚠️');
  }
}

// ---------- 초기화 ----------
document.addEventListener('DOMContentLoaded', function() {
  renderTransferCart();
  loadStores();
  loadMovements();
});
</script>

   이 화면은 이동 바구니가 짧아도 되므로 높이만 따로 잡는다. */
.sale-right { max-height: 520px; }
@media (max-width: 768px) {
  .sale-right { max-height: none; }
}
</style>
