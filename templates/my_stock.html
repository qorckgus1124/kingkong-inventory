{% extends "base.html" %}
{% block content_class %}content--wide{% endblock %}
{% block content %}
<h1><svg class="i3d page-icon" aria-hidden="true"><use href="#i3d-package"></use></svg><span id="msTitle">내 재고</span></h1>
<div class="subtitle" id="msSub">현재 재고 수량을 조회합니다. 재고는 조회 전용이고, 원가는 매장에서 직접 수정할 수 있습니다. (원가 칸을 누르세요)</div>

<div class="card ms-filter">
  <div class="ms-row">
    <label class="ms-field" id="msStoreWrap" style="display:none;">
      <span class="ms-label">매장</span>
      <select id="msStore"></select>
    </label>
    <label class="ms-field ms-grow">
      <span class="ms-label">검색</span>
      <input type="text" id="msSearch" placeholder="🔍 제품명 · 브랜드 (공백 무시)" autocomplete="off">
    </label>
    <label class="ms-field">
      <span class="ms-label">카테고리</span>
      <select id="msCat"><option value="">전체</option></select>
    </label>
    <label class="ms-check"><input type="checkbox" id="msOnlyStock" checked> 재고 있는 것만</label>
    <label class="ms-check"><input type="checkbox" id="msOnlyLow"> 최소재고 이하만</label>
  </div>
</div>

<div class="summary-cards ms-summary">
  <div class="summary-card"><div class="label">조회 품목</div><div class="value" id="msCount">-</div></div>
  <div class="summary-card"><div class="label">총 재고 수량</div><div class="value" id="msQty">-</div></div>
  <div class="summary-card"><div class="label">재고 원가 합계</div><div class="value" id="msCost">-</div></div>
</div>

<div class="table-wrap">
  <table id="msTable">
    <thead>
      <tr>
        <th data-k="category">카테고리</th>
        <th data-k="brand">브랜드</th>
        <th data-k="name">제품명</th>
        <th data-k="qty" class="num">재고</th>
        <th data-k="min_qty" class="num">최소재고</th>
        <th data-k="cost_price" class="num">원가</th>
        <th data-k="card_cost_price" class="num">카드원가</th>
        <th data-k="sale_price" class="num">판매가</th>
      </tr>
    </thead>
    <tbody id="msBody"><tr><td colspan="8"><div class="empty"><span class="empty-icon">⏳</span>불러오는 중...</div></td></tr></tbody>
  </table>
</div>

<script>
(function () {
  let data = null;
  let sortKey = 'category';
  let sortDir = 1;

  const $ = (id) => document.getElementById(id);
  const norm = (s) => String(s || '').replace(/\s+/g, '').toLowerCase();
  const fmt = (n) => Number(n || 0).toLocaleString('ko-KR');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function load(storeId) {
    const url = '/api/my/stock' + (storeId ? '?store_id=' + encodeURIComponent(storeId) : '');
    const res = await fetch(url, { credentials: 'same-origin' });
    if (res.status === 401) { location.href = '/login?next=/my-stock'; return; }
    const json = await res.json();
    if (!res.ok) {
      $('msBody').innerHTML = '<tr><td colspan="8"><div class="empty"><span class="empty-icon">⚠️</span>' + esc(json.error || '불러오지 못했습니다.') + '</div></td></tr>';
      return;
    }
    data = json;
    $('msTitle').textContent = json.is_admin ? '매장 재고 조회' : (json.store.name + ' 재고');
    $('msSub').textContent = json.store.name + ' · 재고는 조회 전용 · 원가 칸을 눌러 이 매장 원가를 수정합니다 (비우면 전체 공통 원가로 복귀)';
    if (json.is_admin) {
      const sel = $('msStore');
      sel.innerHTML = json.stores.map((s) => '<option value="' + s.id + '">' + esc(s.name) + '</option>').join('');
      sel.value = json.store.id;
      $('msStoreWrap').style.display = '';
    }
    const cats = Array.from(new Set(json.items.map((i) => i.category).filter(Boolean))).sort();
    const catSel = $('msCat');
    const keep = catSel.value;
    catSel.innerHTML = '<option value="">전체</option>' + cats.map((c) => '<option>' + esc(c) + '</option>').join('');
    catSel.value = cats.includes(keep) ? keep : '';
    render();
  }

  function render() {
    if (!data) return;
    const q = norm($('msSearch').value);
    const cat = $('msCat').value;
    const onlyStock = $('msOnlyStock').checked;
    const onlyLow = $('msOnlyLow').checked;

    let rows = data.items.filter((i) => {
      if (cat && i.category !== cat) return false;
      if (onlyStock && i.qty <= 0) return false;
      if (onlyLow && !(i.min_qty > 0 && i.qty <= i.min_qty)) return false;
      if (q && !(norm(i.name).includes(q) || norm(i.brand).includes(q))) return false;
      return true;
    });

    rows.sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * sortDir;
      return String(x || '').localeCompare(String(y || ''), 'ko') * sortDir;
    });

    let totalQty = 0, totalCost = 0;
    rows.forEach((i) => { totalQty += i.qty; totalCost += i.qty * i.cost_price; });
    $('msCount').textContent = fmt(rows.length);
    $('msQty').textContent = fmt(totalQty);
    $('msCost').textContent = fmt(totalCost) + '원';

    if (!rows.length) {
      $('msBody').innerHTML = '<tr><td colspan="8"><div class="empty"><span class="empty-icon">📭</span>조건에 맞는 제품이 없습니다.</div></td></tr>';
      return;
    }
    $('msBody').innerHTML = rows.map((i) => {
      const low = i.min_qty > 0 && i.qty <= i.min_qty;
      return '<tr>' +
        '<td>' + esc(i.category) + '</td>' +
        '<td>' + esc(i.brand) + '</td>' +
        '<td class="ms-name">' + esc(i.name) + '</td>' +
        '<td class="num ms-qty' + (i.qty <= 0 ? ' ms-zero' : (low ? ' ms-low' : '')) + '">' + fmt(i.qty) + (low && i.qty > 0 ? ' ⚠' : '') + '</td>' +
        '<td class="num">' + fmt(i.min_qty) + '</td>' +
        '<td class="num ms-cost' + (i.cost_custom ? ' ms-custom' : '') + '" data-id="' + i.id + '" title="' +
          (i.cost_custom ? '매장 원가 (전체 공통 ' + fmt(i.global_cost_price) + '원)' : '전체 공통 원가 · 눌러서 이 매장 원가로 수정') + '">' +
          fmt(i.cost_price) + (i.cost_custom ? ' <span class="ms-badge">매장</span>' : '') + '</td>' +
        '<td class="num">' + fmt(i.card_cost_price) + '</td>' +
        '<td class="num">' + fmt(i.sale_price) + '</td>' +
        '</tr>';
    }).join('');
  }

  document.querySelectorAll('#msTable thead th').forEach((th) => {
    th.style.cursor = 'pointer';
    th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
      render();
    });
  });
  // 원가 칸을 누르면 입력창으로 바뀐다. Enter/포커스 해제 = 저장, Esc = 취소, 빈 값 = 전체 공통 원가로 복귀.
  $('msBody').addEventListener('click', (e) => {
    const td = e.target.closest('td.ms-cost');
    if (!td || td.querySelector('input')) return;
    const item = data.items.find((x) => String(x.id) === td.dataset.id);
    if (!item) return;
    const input = document.createElement('input');
    input.type = 'number'; input.min = '0'; input.step = '1'; input.className = 'ms-cost-input';
    input.value = item.cost_custom ? item.cost_price : '';
    input.placeholder = String(item.global_cost_price);
    td.textContent = ''; td.appendChild(input); input.focus(); input.select();
    let done = false;
    const finish = async (save) => {
      if (done) return; done = true;
      if (save) {
        const body = { product_id: item.id, cost_price: input.value };
        if (data.is_admin) body.store_id = data.store.id;
        try {
          const res = await fetch('/api/my/cost', { method: 'PUT', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          const json = await res.json();
          if (!res.ok) { alert(json.error || '저장하지 못했습니다.'); }
          else { item.cost_price = json.cost_price; item.cost_custom = json.cost_custom; item.global_cost_price = json.global_cost_price; }
        } catch (err) { alert('저장하지 못했습니다. 네트워크를 확인하세요.'); }
      }
      render();
    };
    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') finish(true);
      else if (ev.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
  });
  ['msSearch', 'msCat', 'msOnlyStock', 'msOnlyLow'].forEach((id) => $(id).addEventListener('input', render));
  $('msStore').addEventListener('change', (e) => load(e.target.value));

  load();
})();
</script>

<style>
.ms-cost { cursor: pointer; }
.ms-cost:hover { background: rgba(120,120,255,.10); }
.ms-badge { font-size: 11px; padding: 1px 6px; border-radius: 8px; background: rgba(120,120,255,.18); margin-left: 4px; }
.ms-cost-input { width: 90px; text-align: right; padding: 4px 6px; }
.ms-filter { padding: 16px 18px; margin-bottom: 14px; }
.ms-filter:hover { transform: none; }
.ms-row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
.ms-field { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
.ms-grow { flex: 1 1 240px; }
.ms-label { font-size: 13px; font-weight: 700; color: var(--text); }
.ms-field input, .ms-field select { width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 15px; }
.ms-check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); padding-bottom: 8px; }
.ms-summary { margin-bottom: 14px; }
#msTable th.num, #msTable td.num { text-align: right; font-variant-numeric: tabular-nums; }
#msTable td { white-space: nowrap; font-size: 14px; }
#msTable td.ms-name { white-space: normal; min-width: 180px; font-weight: 700; }
.ms-qty { font-weight: 800; }
.ms-zero { color: var(--text-muted); }
.ms-low { color: #d6791f; }
</style>
{% endblock %}
