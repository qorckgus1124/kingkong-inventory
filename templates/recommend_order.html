{% extends "base.html" %}
{% block content %}
<h1><i class="ti ti-bulb page-icon"></i>발주 추천</h1>
<div class="subtitle">최근 판매 데이터를 기반으로 매장별 발주 추천 수량을 확인하세요.</div>

<div class="toolbar">
  <select id="storeSelect" onchange="onRecommendStoreChange()">
    <option value="">전체 매장</option>
  </select>
  <select id="categoryFilter" onchange="changePage(0)">
    <option value="">전체 카테고리</option>
  </select>
  <div class="autocomplete-wrap" style="position:relative; display:inline-block; width:160px;">
    <input type="text" id="brandFilter" placeholder="🏷️ 브랜드명 검색" autocomplete="off" oninput="onRecommendBrandInput()" style="width:100%;">
    <div class="autocomplete-list" id="recommendBrandAcList"></div>
  </div>
  <label style="font-size:12px; color:var(--text-light);">기간:
    <select id="daysSelect" onchange="changePage(0)">
      <option value="7">7일</option>
      <option value="14" selected>14일</option>
      <option value="30">30일</option>
      <option value="60">60일</option>
    </select>
  </label>
  <label style="font-size:12px; color:var(--text-light);">목표 재고일수:
    <input type="number" id="targetDays" value="7" style="width:60px;" onchange="changePage(0)">
  </label>
  <select id="sortSelect" onchange="changePage(0)">
    <option value="recommend_qty" selected>추천 발주량 많은 순</option>
    <option value="shortage">부족량 큰 순</option>
    <option value="total_sold">판매량 많은 순</option>
    <option value="current_qty">재고 적은 순</option>
  </select>
  <button onclick="loadRecommend()" class="primary">🔄 새로고침</button>
</div>

<!-- 📌 페이지네이션을 테이블 위에 고정 -->
<div class="table-toolbar" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px; position:sticky; top:0; background:var(--bg); z-index:5; padding:6px 0;">
  <div style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-light);">
    <span>총 <span id="totalCount">0</span>건</span>
    <span>|</span>
    <label>조회 줄수:
      <input type="number" id="rowsPerPage" value="20" min="5" max="100" style="width:60px; padding:4px;" onchange="changePage(0)">
    </label>
  </div>
  <div>
    <button onclick="changePage(-1)" id="prevPageBtn" class="page-btn">◀ 이전</button>
    <span id="pageInfo" style="font-size:13px; color:var(--text-light); margin:0 8px;">1 / 1</span>
    <button onclick="changePage(1)" id="nextPageBtn" class="page-btn">다음 ▶</button>
  </div>
</div>

<div class="summary-cards" style="margin-bottom:16px;">
  <div class="summary-card"><div class="label">추천 제품 수</div><div class="value" id="recommendCount">-</div></div>
  <div class="summary-card"><div class="label">총 추천 발주량</div><div class="value" id="totalRecommend">-</div></div>
  <div class="summary-card"><div class="label">추천 발주 총액(원가 기준)</div><div class="value" id="totalRecommendCost">-</div></div>
  <div class="summary-card"><div class="label">발주 예산</div><div class="value" id="orderBudgetValue">-</div></div>
  <div class="summary-card"><div class="label">예산 대비 잔액</div><div class="value" id="orderBudgetRemaining">-</div></div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>제품명</th>
        <th>브랜드</th>
        <th>카테고리</th>
        <th>원가</th>
        <th>판매가</th>
        <th>현재 재고</th>
        <th>총 판매량<br><span style="font-weight:400; font-size:10px; color:var(--text-light);">(선택 기간)</span></th>
        <th>일평균 판매</th>
        <th>예상 필요량</th>
        <th>부족량</th>
        <th>추천 발주량</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
console.log('📦 발주 추천 페이지 로드됨');

let currentPage = 1;
let totalPages = 1;
let totalItems = 0;
let rowsPerPage = 20;

// ---------- 필터 드롭다운 로드 ----------
async function loadFilters() {
  try {
    // 카테고리
    const categories = await api('/api/categories');
    const catSel = document.getElementById('categoryFilter');
    catSel.innerHTML = '<option value="">전체 카테고리</option>' +
      categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  } catch (e) {
    console.error('카테고리 로드 오류:', e);
  }

  // 매장
   try {
    const stores = await api('/api/stores');
    const storeSel = document.getElementById('storeSelect');
    storeSel.innerHTML = '<option value="">전체 매장</option>' +
      stores.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
    
    // 🔥 전역 매장 ID 적용
    const globalStoreId = localStorage.getItem('global_store_id');
    if (globalStoreId && stores.some(s => s.id == globalStoreId)) {
      storeSel.value = globalStoreId;
    }
  } catch (e) {
    console.error('매장 로드 오류:', e);
  }
}

// ---------- 매장 선택 변경 ----------
// 다른 화면(판매/입출고/이동 등)과 동일하게, 여기서 매장을 바꾸면
// 전역 매장 선택값을 저장해서 다른 화면으로 이동해도 같은 매장이 유지되게 한다.
function onRecommendStoreChange() {
  const storeId = document.getElementById('storeSelect').value;
  if (storeId) {
    localStorage.setItem('global_store_id', storeId);
  }
  changePage(0);
}

// ---------- 브랜드명 검색(자동완성) ----------
let _recommendBrandAcTimer = null;
async function onRecommendBrandInput() {
  clearTimeout(_recommendBrandAcTimer);
  const q = document.getElementById('brandFilter').value.trim();
  const listEl = document.getElementById('recommendBrandAcList');
  if (!q) {
    listEl.classList.remove('show');
    changePage(0);
    return;
  }
  _recommendBrandAcTimer = setTimeout(async () => {
    try {
      const brands = await api('/api/brands?search=' + encodeURIComponent(q));
      if (!brands || brands.length === 0) {
        listEl.classList.remove('show');
      } else {
        listEl.innerHTML = brands.slice(0, 10).map(b => `
          <div class="autocomplete-item" onclick="pickRecommendBrand('${escapeHtml(b.name).replace(/'/g, "\\'")}')">
            ${escapeHtml(b.name)}
          </div>
        `).join('');
        listEl.classList.add('show');
      }
    } catch (e) {
      console.error('브랜드 자동완성 오류:', e);
    }
    changePage(0);
  }, 200);
}

function pickRecommendBrand(name) {
  document.getElementById('brandFilter').value = name;
  document.getElementById('recommendBrandAcList').classList.remove('show');
  changePage(0);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('#brandFilter') && !e.target.closest('#recommendBrandAcList')) {
    document.getElementById('recommendBrandAcList')?.classList.remove('show');
  }
});

// ---------- 페이지 변경 ----------
function changePage(delta) {
  if (delta === 0) {
    // rowsPerPage 변경
    rowsPerPage = parseInt(document.getElementById('rowsPerPage').value) || 20;
    currentPage = 1;
  } else {
    const newPage = currentPage + delta;
    if (newPage < 1 || newPage > totalPages) return;
    currentPage = newPage;
  }
  loadRecommend();
}

// ---------- 데이터 로드 ----------
async function loadRecommend() {
  console.log('🔄 발주 추천 데이터 로드 시작...');

  // 로딩 표시
  document.getElementById('tbody').innerHTML = '<tr><td colspan="12"><div class="empty"><span class="empty-icon">⏳</span>로딩 중...</div></td></tr>';
  document.getElementById('totalCount').textContent = '...';

  const store_id = document.getElementById('storeSelect').value;
  const days = document.getElementById('daysSelect').value;
  const target_days = document.getElementById('targetDays').value || 7;
  const category_id = document.getElementById('categoryFilter').value;
  const brand_q = document.getElementById('brandFilter').value.trim();
  const sort_by = document.getElementById('sortSelect').value;
  rowsPerPage = parseInt(document.getElementById('rowsPerPage').value) || 20;
  const offset = (currentPage - 1) * rowsPerPage;

  const params = new URLSearchParams({
    days: days,
    target_days: target_days,
    limit: rowsPerPage,
    offset: offset,
    sort_by: sort_by
  });
  if (store_id) params.append('store_id', store_id);
  if (category_id) params.append('category_id', category_id);
  if (brand_q) params.append('brand_q', brand_q);

  try {
    const data = await api('/api/recommend_order?' + params.toString());
    console.log('✅ 추천 데이터 수신:', data);

    const rows = data.items || [];
    totalItems = data.total || 0;
    totalPages = Math.ceil(totalItems / rowsPerPage) || 1;
    if (currentPage > totalPages) currentPage = totalPages;

    const tbody = document.getElementById('tbody');
    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="12"><div class="empty"><span class="empty-icon">📊</span>추천 데이터가 없습니다.</div></td></tr>';
      document.getElementById('recommendCount').textContent = '0';
      document.getElementById('totalRecommend').textContent = '0개';
    } else {
      let recommendCount = 0;
      let totalRecommend = 0;
      tbody.innerHTML = rows.map((r, idx) => {
        const recQty = r.recommend_qty || 0;
        if (recQty > 0) {
          recommendCount++;
          totalRecommend += recQty;
        }
        return `
          <tr>
            <td><span class="row-number">${idx + 1 + offset}</span></td>
            <td>${escapeHtml(r.product_name)}</td>
            <td>${r.brand_name ? `<span class="brand-tag" style="background:${r.brand_color || '#8a8f98'};">${escapeHtml(r.brand_name)}</span>` : '-'}</td>
            <td>${r.category_name ? `<span class="chip" style="background:${r.category_color || '#8a8f98'};">${escapeHtml(r.category_name)}</span>` : '-'}</td>
            <td>${fmt(r.cost_price)}원</td>
            <td>${fmt(r.sale_price)}원</td>
            <td>${fmt(r.current_qty)}</td>
            <td style="font-weight:600; color:var(--accent);">${fmt(r.total_sold)}</td>
            <td>${r.avg_daily_sales || 0}</td>
            <td>${fmt(r.expected_demand)}</td>
            <td style="font-weight:700; color:${r.shortage > 0 ? 'var(--danger)' : 'var(--text-light)'};">${fmt(r.shortage)}</td>
            <td style="font-weight:700; color:${recQty > 0 ? 'var(--danger)' : 'var(--text-light)'};">${fmt(recQty)}</td>
          </tr>
        `;
      }).join('');
      document.getElementById('recommendCount').textContent = recommendCount;
      document.getElementById('totalRecommend').textContent = fmt(totalRecommend) + '개';
    }

    // 페이지 정보 업데이트
    document.getElementById('totalCount').textContent = totalItems;
    document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
    document.getElementById('prevPageBtn').disabled = currentPage <= 1;
    document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;

    // 발주 예산 비교 (필터에 해당하는 전체 목록 기준, 현재 페이지만이 아님)
    const totalCost = data.total_recommend_cost || 0;
    const budget = data.order_budget || 0;
    const remaining = data.order_budget_remaining ?? (budget - totalCost);
    document.getElementById('totalRecommendCost').textContent = fmt(totalCost) + '원';
    document.getElementById('orderBudgetValue').textContent = budget > 0 ? fmt(budget) + '원' : '설정 안함';
    const remainingEl = document.getElementById('orderBudgetRemaining');
    if (budget > 0) {
      remainingEl.textContent = (remaining < 0 ? '-' : '') + fmt(Math.abs(remaining)) + '원';
      remainingEl.style.color = remaining < 0 ? 'var(--danger)' : 'var(--accent)';
    } else {
      remainingEl.textContent = '-';
      remainingEl.style.color = '';
    }

  } catch (e) {
    console.error('❌ 추천 로드 오류:', e);
    toast('데이터를 불러오는 중 오류가 발생했습니다.', true, '⚠️');
    document.getElementById('tbody').innerHTML = '<tr><td colspan="12"><div class="empty"><span class="empty-icon">⚠️</span>데이터를 불러올 수 없습니다.</div></td></tr>';
    document.getElementById('totalCount').textContent = '0';
    document.getElementById('pageInfo').textContent = '0 / 0';
    document.getElementById('recommendCount').textContent = '-';
    document.getElementById('totalRecommend').textContent = '-';
    document.getElementById('totalRecommendCost').textContent = '-';
    document.getElementById('orderBudgetValue').textContent = '-';
    document.getElementById('orderBudgetRemaining').textContent = '-';
  }
}

// ---------- 초기화 ----------
document.addEventListener('DOMContentLoaded', function() {
  console.log('🚀 발주 추천 초기화');
  loadFilters().then(() => {
    loadRecommend();
  });
});
</script>

<style>
.brand-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
  color: white;
}
.page-btn {
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--card-bg);
  color: var(--text);
  cursor: pointer;
}
.page-btn:hover {
  background: var(--hover-bg);
}
.page-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.toolbar select, .toolbar input { padding: 4px 8px; font-size: 12px; }
/* 테이블 툴바 고정 */
.table-toolbar {
  background: var(--bg);
  z-index: 5;
}
</style>
{% endblock %}
