<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>로그인 - 킹콩재고 관리</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
<style>
.lg-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
.lg-card { width: 100%; max-width: 380px; padding: 28px 26px; }
.lg-card:hover { transform: none; }
.lg-title { font-size: 22px; font-weight: 800; margin: 0 0 4px; color: var(--text); }
.lg-sub { font-size: 14px; color: var(--text-light); margin: 0 0 22px; }
.lg-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.lg-field label { font-size: 14px; font-weight: 700; color: var(--text); }
.lg-field input { width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 16px; }
.lg-error { font-size: 14px; color: #d64545; background: rgba(214, 69, 69, 0.1); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
.lg-btn { width: 100%; padding: 13px 14px; font-size: 16px; font-weight: 700; margin-top: 4px; }
.lg-home { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-light); }
</style>
</head>
<body>
<script>
  (function () {
    var saved = localStorage.getItem('darkMode');
    if (saved === 'true' || (saved === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.body.classList.add('dark-mode');
    }
  })();
</script>
<div class="lg-wrap">
  <form class="card lg-card" method="post" action="/login">
    <h1 class="lg-title">킹콩재고 관리</h1>
    <p class="lg-sub">매장 계정으로 로그인하세요.</p>
    {% if error %}<div class="lg-error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="lg-field">
      <label for="lgUser">아이디</label>
      <input type="text" id="lgUser" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" required autofocus>
    </div>
    <div class="lg-field">
      <label for="lgPass">비밀번호</label>
      <input type="password" id="lgPass" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="primary lg-btn">로그인</button>
  </form>
</div>
</body>
</html>
