{% extends "base.html" %}
{% block content %}
<h1><svg class="i3d page-icon" aria-hidden="true"><use href="#i3d-clipboard-check"></use></svg>데이터 점검</h1>
<div class="subtitle">원가·판매가·브랜드가 빠졌거나 원가가 판매가 이상인 제품입니다. 원가가 비어 있으면 순이익과 예상 순이익이 실제보다 크게 나옵니다. 여기서 바로 고치면 목록에서 사라집니다.</div>

<div class="card">
  <div id="dcChips" style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;"></div>
  <div style="display:flex; gap:8px; margin-top:10px; align-items:center;">
    <input type="text" id="dcSearch" placeholder="제품명·브랜드 검색" oninput="render()" style="flex:1;">
    <button onclick="load()">🔄 새로고침</button>
  </div>
</div>

<div class="card" id="dcBulk" style="display:none; position:sticky; top:8px; z-index:5;">
  <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
    <strong id="dcSelCount">0개 선택</strong>
    <input list="dcBrandList" id="dcBulkBrand" placeholder="브랜드 일괄 지정" style="width:160px;">
    <button onclick="bulkBrand()">브랜드 적용</button>
    <select id="dcBulkCat" style="width:130px;"></select>
    <button onclick="bulkCategory()">카테고리 적용</button>
    <button class="danger" onclick="deleteProducts([...dcSelected])">🗑️ 선택 삭제</button>
    <button onclick="dcSelected.clear(); render();">선택 해제</button>
  </div>
</div>

<datalist id="dcBrandList"></datalist>

<div style="overflow-x:auto;">
<table>
  <thead>
    <tr>
      <th style="width:34px"><input type="checkbox" id="dcAll" onchange="toggleAll(this.checked)" title="보이는 제품 전체 선택"></th>
      <th>문제</th><th>제품명</th><th style="min-width:150px">브랜드</th><th>카테고리</th>
      <th class="num" style="width:110px">원가</th><th class="num" style="width:110px">판매가</th>
      <th class="num">재고</th><th style="width:120px"></th>
    </tr>
  </thead>
  <tbody id="dcBody"><tr><td colspan="9"><div class="empty">불러오는 중…</div></td></tr></tbody>
</table>
</div>

<style>
.dc-tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; margin:1px 2px 1px 0; white-space:nowrap; }
.dc-no_cost { background:rgba(255,159,10,.18); color:#c46a00; }
.dc-no_price { background:rgba(255,69,58,.15); color:#d0302a; }
.dc-no_brand { background:rgba(120,120,140,.18); color:var(--text-light); }
.dc-neg_margin { background:rgba(191,90,242,.16); color:#9a3fd0; }
.dc-chip.active { outline:2px solid var(--primary, #4f8ff7); }
td.num, th.num, input.num { text-align:right; }
#dcBody input, #dcBody select { width:100%; padding:5px 8px; font-size:13px; }
</style>
{% endblock %}

{% block scripts %}
<script>
const apiFailed = (r) => !!(r && r.__apiError);
const DC_LABELS = { no_cost: '원가 없음', no_price: '판매가 없음', no_brand: '브랜드 없음', neg_margin: '역마진' };
let dcItems = [], dcBrands = [], dcCategories = [], dcFilter = '', dcVisible = [];
const dcSelected = new Set();

async function load() {
  const [items, brands, cats] = await Promise.all([api('/api/data_check'), api('/api/brands'), api('/api/categories')]);
  if (apiFailed(items)) return;
  dcItems = items;
  dcBrands = apiFailed(brands) ? [] : brands;
  dcCategories = apiFailed(cats) ? [] : cats;
  document.getElementById('dcBrandList').innerHTML = dcBrands.map(b => `<option value="${escapeHtml(b.name)}">`).join('');
  document.getElementById('dcBulkCat').innerHTML = '<option value="">카테고리 선택</option><option value="__none__">미분류</option>' +
    dcCategories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  // 목록에서 사라진(고쳐진/삭제된) 제품은 선택에서도 뺀다
  const alive = new Set(dcItems.map(i => i.id));
  [...dcSelected].forEach(id => { if (!alive.has(id)) dcSelected.delete(id); });
  render();
}

function render() {
  const counts = {};
  dcItems.forEach(i => i.issues.forEach(k => counts[k] = (counts[k] || 0) + 1));
  document.getElementById('dcChips').innerHTML =
    `<button class="dc-chip ${dcFilter === '' ? 'active' : ''}" onclick="setFilter('')">전체 ${dcItems.length}</button>` +
    Object.keys(DC_LABELS).map(k =>
      `<button class="dc-chip ${dcFilter === k ? 'active' : ''}" onclick="setFilter('${k}')">${DC_LABELS[k]} ${counts[k] || 0}</button>`).join('');

  const q = document.getElementById('dcSearch').value.trim().toLowerCase();
  const rows = dcItems.filter(i => (!dcFilter || i.issues.includes(dcFilter)) &&
    (!q || (i.name + ' ' + (i.brand_name || '')).toLowerCase().includes(q)));
  dcVisible = rows.map(i => i.id);
  updateBulkBar();
  const body = document.getElementById('dcBody');
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="9"><div class="empty"><span class="empty-icon">✅</span>고칠 제품이 없습니다.</div></td></tr>';
    return;
  }
  const catOptions = (sel) => '<option value="">미분류</option>' +
    dcCategories.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
  body.innerHTML = rows.map(i => `
    <tr data-id="${i.id}">
      <td><input type="checkbox" ${dcSelected.has(i.id) ? 'checked' : ''} onchange="toggleOne(${i.id}, this.checked)"></td>
      <td>${i.issues.map(k => `<span class="dc-tag dc-${k}">${DC_LABELS[k]}</span>`).join('')}</td>
      <td>${escapeHtml(i.name)}</td>
      <td><input list="dcBrandList" class="dc-brand" value="${escapeHtml(i.brand_name || '')}" placeholder="브랜드 선택"></td>
      <td><select class="dc-cat">${catOptions(i.category_id)}</select></td>
      <td><input type="number" class="dc-cost num" value="${i.cost_price || ''}" placeholder="0"></td>
      <td><input type="number" class="dc-sale num" value="${i.sale_price || ''}" placeholder="0"></td>
      <td class="num">${fmt(i.qty)}</td>
      <td style="white-space:nowrap;"><button class="primary" onclick="saveRow(${i.id}, this)">저장</button>
        <button class="danger" onclick="deleteProducts([${i.id}])" title="삭제">🗑️</button></td>
    </tr>`).join('');
}

function setFilter(k) { dcFilter = k; render(); }

function updateBulkBar() {
  const n = dcSelected.size;
  document.getElementById('dcBulk').style.display = n ? '' : 'none';
  document.getElementById('dcSelCount').textContent = `${n}개 선택`;
  const all = document.getElementById('dcAll');
  const shownSel = dcVisible.filter(id => dcSelected.has(id)).length;
  all.checked = dcVisible.length > 0 && shownSel === dcVisible.length;
  all.indeterminate = shownSel > 0 && shownSel < dcVisible.length;
}
function toggleOne(id, on) { on ? dcSelected.add(id) : dcSelected.delete(id); updateBulkBar(); }
function toggleAll(on) { dcVisible.forEach(id => on ? dcSelected.add(id) : dcSelected.delete(id)); render(); }

async function deleteProducts(ids) {
  if (!ids.length) return;
  const names = dcItems.filter(i => ids.includes(i.id));
  const withStock = names.filter(i => i.qty > 0).length;
  const msg = `${ids.length}개 제품을 삭제할까요?\n\n` +
    `· 판매·입출고 기록이 없는 제품은 완전히 삭제됩니다.\n` +
    `· 기록이 있는 제품은 과거 매출을 지키기 위해 숨김(비활성) 처리됩니다. (제품 관리에서 다시 살릴 수 있음)` +
    (withStock ? `\n\n⚠️ 이 중 ${withStock}개는 재고가 남아 있습니다.` : '');
  if (!confirm(msg)) return;
  const res = await api('/api/data_check/delete', { method: 'POST', body: JSON.stringify({ product_ids: ids }) });
  if (apiFailed(res)) return;
  ids.forEach(id => dcSelected.delete(id));
  toast(`삭제 ${res.deleted}개 · 숨김 ${res.hidden}개`, false, '🗑️');
  await load();
}

async function batchUpdate(updates, label) {
  const ids = [...dcSelected];
  if (!ids.length) return;
  const res = await api('/api/products/batch_update', { method: 'POST', body: JSON.stringify({ product_ids: ids, updates }) });
  if (apiFailed(res)) return;
  toast(`${res.updated}개 제품의 ${label}을(를) 바꿨습니다.`, false, '✅');
  await load();
}
function bulkBrand() {
  const name = document.getElementById('dcBulkBrand').value.trim();
  const b = dcBrands.find(x => x.name === name);
  if (!b) { toast('목록에 있는 브랜드를 골라주세요.', true, '⚠️'); return; }
  batchUpdate({ brand_id: b.id }, '브랜드');
}
function bulkCategory() {
  const v = document.getElementById('dcBulkCat').value;
  if (!v) { toast('카테고리를 골라주세요.', true, '⚠️'); return; }
  batchUpdate({ category_id: v === '__none__' ? null : Number(v) }, '카테고리');
}

async function saveRow(id, btn) {
  const tr = btn.closest('tr');
  const brandName = tr.querySelector('.dc-brand').value.trim();
  let brand_id = null;
  if (brandName) {
    const b = dcBrands.find(x => x.name === brandName);
    if (!b) { toast('없는 브랜드입니다. 브랜드 관리에서 먼저 추가해주세요.', true, '⚠️'); return; }
    brand_id = b.id;
  }
  const cost = parseInt(tr.querySelector('.dc-cost').value) || 0;
  const sale = parseInt(tr.querySelector('.dc-sale').value) || 0;
  // 카드원가는 제품 관리 화면과 같은 식으로 다시 계산한다
  const cardCost = sale > 0 ? Math.max(Math.round(cost + sale - (sale / 1.1 * 0.975)), 0) : 0;
  const catVal = tr.querySelector('.dc-cat').value;
  btn.disabled = true;
  const res = await api(`/api/products/${id}`, { method: 'PUT', body: JSON.stringify({
    brand_id, category_id: catVal ? Number(catVal) : null,
    cost_price: cost, sale_price: sale, card_cost_price: cardCost, staff: '데이터 점검'
  }) });
  btn.disabled = false;
  if (apiFailed(res)) return;
  toast('저장했습니다.', false, '✅');
  await load();
}

load();
</script>
{% endblock %}
