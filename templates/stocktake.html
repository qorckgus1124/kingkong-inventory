{% extends "base.html" %}
{% block content %}
<h1>🧾 재고 실사</h1>
<div class="subtitle">매장을 돌면서 실제 수량을 입력하면 시스템 재고와 차이를 자동으로 비교합니다. 저장 시 실제 수량으로 재고가 변경되고, 과거 입출고 내역은 수정되지 않습니다.</div>

<div class="summary-cards">
  <div class="summary-card"><div class="label">📦 전체 품목</div><div class="value" id="statTotal">-</div></div>
  <div class="summary-card" style="background:var(--accent-light);"><div class="label">⚠️ 차이 발생 품목</div><div class="value" id="statDiffCount">-</div></div>
  <div class="summary-card"><div class="label">🔀 순증감 수량</div><div class="value" id="statNetDiff">-</div></div>
</div>

<div class="card">
  <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr;">
    <div class="form-field"><label>매장</label><select id="storeSelect" onchange="load()"></select></div>
    <div class="form-field"><label>실사 담당자</label><input type="text" id="staffInput" placeholder="이름"></div>
    <div class="form-field">
      <label>&nbsp;</label>
      <div style="display:flex; gap:8px;">
        <button class="primary" onclick="save()" style="flex:1;">💾 저장</button>
        <button onclick="exportCsv()" style="flex:1;">⬇️ 실사표 내보내기</button>
      </div>
    </div>
  </div>
</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>카테고리</th><th>브랜드</th><th>제품명</th><th>시스템 수량</th><th>실사 수량</th><th>차이</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<script>
let items = [];

async function loadStores() {
  const stores = await api('/api/stores');
  const sel = document.getElementById('storeSelect');
  sel.innerHTML = (stores || []).map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
}

async function load() {
  const storeId = document.getElementById('storeSelect').value;
  if (!storeId) return;
  items = await api(`/api/stocktake?store_id=${storeId}`);
  updateStats();
  render();
}

function updateStats() {
  const list = items || [];
  const diffItems = list.filter(it => it.actual_qty !== it.system_qty);
  const netDiff = list.reduce((sum, it) => sum + (it.actual_qty - it.system_qty), 0);
  document.getElementById('statTotal').textContent = fmt(list.length) + '개';
  document.getElementById('statDiffCount').textContent = fmt(diffItems.length) + '개';
  const netEl = document.getElementById('statNetDiff');
  netEl.textContent = (netDiff > 0 ? '+' : '') + fmt(netDiff) + '개';
  netEl.style.color = netDiff === 0 ? '' : (netDiff > 0 ? '#4f8ff7' : '#c44536');
}

function render() {
  const tbody = document.getElementById('tbody');
  if (!items || items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty"><span class="empty-icon">📦</span>실사할 재고가 없습니다.</div></td></tr>';
    return;
  }
  tbody.innerHTML = items.map((it, idx) => `
    <tr id="row_${idx}">
      <td>${it.category_name ? `<span class="chip" style="background:#8a8f98;">${escapeHtml(it.category_name)}</span>` : '<span style="color:var(--text-light);">-</span>'}</td>
      <td>${escapeHtml(it.brand_name || '-')}</td>
      <td>${escapeHtml(it.product_name)}</td>
      <td>${fmt(it.system_qty)}</td>
      <td><input type="number" value="${it.actual_qty}" style="width:90px;" oninput="updateActual(${idx}, this.value)"></td>
      <td id="diff_${idx}" style="font-weight:600;">${diffLabel(it.actual_qty - it.system_qty)}</td>
    </tr>
  `).join('');
  items.forEach((it, idx) => applyRowTint(idx, it.actual_qty - it.system_qty));
}

function diffLabel(diff) {
  if (diff === 0) return '<span style="color:var(--text-light);">0</span>';
  const color = diff > 0 ? '#4f8ff7' : '#c44536';
  return `<span style="color:${color};">${diff > 0 ? '+' : ''}${diff}</span>`;
}

function applyRowTint(idx, diff) {
  const row = document.getElementById(`row_${idx}`);
  if (!row) return;
  row.style.background = diff === 0 ? '' : (diff > 0 ? 'rgba(79,143,247,0.08)' : 'rgba(196,69,54,0.08)');
}

function updateActual(idx, value) {
  items[idx].actual_qty = parseInt(value || '0', 10);
  const diff = items[idx].actual_qty - items[idx].system_qty;
  document.getElementById(`diff_${idx}`).innerHTML = diffLabel(diff);
  applyRowTint(idx, diff);
  updateStats();
}

async function save() {
  const storeId = document.getElementById('storeSelect').value;
  const staff = document.getElementById('staffInput').value.trim();
  if (!storeId) { toast('매장을 선택해주세요.', true, '⚠️'); return; }
  const payload = {
    store_id: storeId,
    staff,
    items: items.map(it => ({ product_id: it.product_id, actual_qty: it.actual_qty }))
  };
  const res = await api('/api/stocktake', { method: 'POST', body: JSON.stringify(payload) });
  if (res && res.ok) {
    toast(`${(res.changes || []).length}건의 재고가 조정되었습니다.`, false, '✅');
    load();
  }
}

function exportCsv() {
  const storeId = document.getElementById('storeSelect').value;
  if (!storeId) { toast('매장을 선택해주세요.', true, '⚠️'); return; }
  window.location.href = `/api/stocktake/export?store_id=${storeId}`;
}

(async () => {
  await loadStores();
  load();
})();
</script>
{% endblock %}
