services:
  - type: web
    name: my-inventory-app
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    # gunicorn 워커 수(WEB_CONCURRENCY) x DB_POOL_MAXCONN 합이 DB 무료 플랜의
    # 최대 동시 연결 수를 넘지 않도록 --timeout도 넉넉히 준다.
    # --timeout 120: Neon/Aiven 무료 플랜은 일정 시간 미사용 시 DB가 슬립 상태가 되어
    # 첫 요청에서 cold start 지연(최대 수십 초)이 발생한다. 60초면 이 경우 타임아웃이
    # 나서 502 에러가 뜨므로 120초로 늘린다.
    # --worker-class sync: 기본값이지만 명시해서 의도를 분명히 한다. (gevent 등으로
    # 바꾸려면 requirements.txt에 gevent 추가 필요)
    startCommand: "gunicorn app:app --workers ${WEB_CONCURRENCY:-2} --worker-class sync --timeout 120"
    envVars:
      # DATABASE_URL은 여기서 자동으로 채우지 않는다.
      # Render 대시보드 > Environment 탭에서 직접 값을 넣어야 한다.
      # (지금은 Neon 커넥션 문자열을 사용 - Neon 콘솔의 Connect 버튼에서 확인 가능)
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: DB_POOL_MAXCONN
        value: 4

# 참고: 예전에는 이 밑에 Render 자체 free Postgres(databases: 블록)가 있었지만
# 실제로는 쓰지 않는 리소스였고 30일 후 자동 삭제되어 혼란만 줬기 때문에 제거함.
# 지금은 Neon(무료 Postgres)을 DATABASE_URL로 직접 연결해서 쓴다.