<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05030F">
<title>오프라인 - 킹콩재고 관리</title>
<style>
  /* KINGKONG HYPER-GLASS — 오프라인 폴백.
     외부 폰트/CSS 없이 단독으로 그려져야 하므로 토큰을 이 파일 안에 직접 둔다. */
  :root {
    --bg: #05030F;
    --text: #F3F1FF;
    --text-light: #ADA7DC;
    --glass: rgba(23, 18, 55, 0.62);
    --glass-border: rgba(160, 140, 255, 0.22);
    --grad-brand: linear-gradient(115deg, #00E5FF 0%, #5B1EFF 48%, #FF2D9B 100%);
    --grid-line: rgba(120, 90, 255, 0.20);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    text-align: center;
    overflow: hidden;
  }

  /* 배경 스테이지 */
  .bg-stage { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .bg-grid {
    position: absolute;
    left: -30%; right: -30%; bottom: -12%; height: 72%;
    background-image:
      linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    background-size: 58px 58px, 58px 58px;
    transform: perspective(560px) rotateX(69deg);
    transform-origin: bottom center;
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 82%);
    mask-image: linear-gradient(to top, #000 0%, transparent 82%);
    animation: drift 14s linear infinite;
  }
  @keyframes drift { to { background-position: 0 58px, 0 58px; } }
  .bg-horizon {
    position: absolute; left: 0; right: 0; bottom: 60%; height: 1px;
    background: var(--grad-brand); opacity: .5;
    box-shadow: 0 0 24px 2px rgba(91, 30, 255, .5);
  }
  .bg-orb {
    position: absolute; border-radius: 50%; filter: blur(72px); opacity: .42;
  }
  .bg-orb.a { width: 44vmax; height: 44vmax; left: -14vmax; top: -16vmax;
    background: radial-gradient(circle at 32% 32%, #00A6FF, transparent 68%); }
  .bg-orb.b { width: 38vmax; height: 38vmax; right: -12vmax; bottom: -10vmax;
    background: radial-gradient(circle at 60% 40%, #FF1E8E, transparent 68%); }

  /* 유리 카드 */
  .wrap {
    position: relative;
    max-width: 340px;
    padding: 32px 26px 26px;
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    backdrop-filter: blur(20px) saturate(1.6);
    box-shadow:
      inset 0 1px 0 rgba(190, 175, 255, .2),
      0 30px 70px -34px rgba(0, 0, 0, .8);
  }
  .icon {
    width: 62px; height: 62px; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; border-radius: 20px;
    background-image: var(--grad-brand);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 14px 34px -12px rgba(91,30,255,.75);
    animation: bob 4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-6px) rotate(-5deg); }
  }
  h1 { font-size: 17px; margin: 0 0 10px; font-weight: 800; letter-spacing: -.01em; }
  p { font-size: 13px; color: var(--text-light); margin: 0 0 22px; line-height: 1.7; }
  button {
    background-image: var(--grad-brand);
    background-size: 190% 100%;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 13px 28px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 3px 0 #2E00A8, 0 14px 30px -12px rgba(91,30,255,.75);
    transition: transform .2s cubic-bezier(.2,.8,.2,1), background-position .4s, box-shadow .2s;
  }
  button:hover { transform: translateY(-2px); background-position: 100% 50%; }
  button:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 1px 0 #2E00A8; }

  @media (prefers-reduced-motion: reduce) {
    .bg-grid, .icon { animation: none; }
  }
</style>
</head>
<body>
  <div class="bg-stage" aria-hidden="true">
    <div class="bg-orb a"></div>
    <div class="bg-orb b"></div>
    <div class="bg-horizon"></div>
    <div class="bg-grid"></div>
  </div>
  <div class="wrap">
    <div class="icon">📡</div>
    <h1>인터넷 연결이 끊겼습니다</h1>
    <p>네트워크 연결을 확인한 뒤 다시 시도해주세요.<br>연결이 복구되면 자동으로 이어집니다.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
